[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgtrail"
version = "0.1.0"
description = "Averigua en qué otras webs aparecen las fotos de tu perfil de Instagram"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Endika Iglesias", email = "endika2@gmail.com" }]
keywords = ["reverse-image-search", "instagram", "osint", "phash", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10",
    "ImageHash>=4.3",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/endika/imgtrail"
Issues = "https://github.com/endika/imgtrail/issues"

[project.scripts]
imgtrail = "imgtrail.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["imgtrail"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
