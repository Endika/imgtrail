[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imgtrail"
version = "0.5.2"
description = "Find out where else on the web your own photos show up"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Endika Iglesias", email = "endika2@gmail.com" }]
keywords = ["reverse-image-search", "instagram", "osint", "phash", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "ImageHash>=4.3",
    "Pillow>=10",
    "httpx>=0.27",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/Endika/imgtrail"
Repository = "https://github.com/Endika/imgtrail"
Issues = "https://github.com/Endika/imgtrail/issues"
Changelog = "https://github.com/Endika/imgtrail/blob/main/CHANGELOG.md"

[project.scripts]
imgtrail = "imgtrail.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["imgtrail"]
artifacts = ["imgtrail/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["imgtrail", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RET",       # returns
    "PTH",       # use pathlib
    "ARG",       # unused arguments
    "TID",       # tidy imports
    "RUF",
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
# No python_version pin: numpy's bundled stubs use 3.12+ syntax that mypy cannot parse
# under an older target. The 3.10 floor is proven by the CI test matrix instead.
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
files = ["imgtrail", "tests"]

# imagehash ships no stubs; numpy's reach mypy only through it and use 3.12+ syntax
# that our declared 3.10 floor cannot parse.
[[tool.mypy.overrides]]
module = ["imagehash.*", "numpy.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["imgtrail"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\.", "raise NotImplementedError"]
